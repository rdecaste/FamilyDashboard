<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>Family Dashboard</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#07111d;color:#f7fbff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:#07111d}
.app{width:100vw;height:100vh;display:grid;grid-template-columns:40% 60%;background:#07111d}
.sidebar{position:relative;z-index:3;padding:2.3vh 1.7vw 2vh;display:flex;flex-direction:column;gap:1.45vh;background:linear-gradient(90deg,rgba(7,17,29,.98) 0%,rgba(7,17,29,.96) 82%,rgba(7,17,29,.82) 94%,rgba(7,17,29,.35) 100%)}
.sidebar-top{display:grid;grid-template-columns:1.3fr 1fr;gap:.8vw}
.date-wrap,.weather,.child{border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.045);box-shadow:0 8px 24px rgba(0,0,0,.16)}
.date-wrap,.weather{border-radius:1.15vw;padding:1vw 1.05vw;min-height:10vh;display:flex;flex-direction:column;justify-content:center}
.date-label,.weather-label{font-size:.68vw;font-weight:760;letter-spacing:.1em;text-transform:uppercase;color:rgba(235,245,255,.62)}
.date-main{margin-top:.28vh;font-size:1.75vw;line-height:1.04;font-weight:820;letter-spacing:-.03em}
.weather-main{display:flex;align-items:center;gap:.55vw;margin-top:.25vh}
.icon{font-size:1.42vw;line-height:1}
.weather strong{font-size:1.62vw;line-height:1;font-weight:820}
.weather-detail{margin-top:.32vh;color:#bfd3e8;font-size:.78vw;font-weight:560;line-height:1.25}
.child{border-radius:1.2vw;padding:1vw 1.05vw .9vw}
.child-head{display:flex;align-items:flex-start;justify-content:space-between;gap:.8vw}
.name{font-size:1.5vw;font-weight:840;letter-spacing:-.025em}
.child-sub{margin-top:.1vh;font-size:.68vw;color:rgba(235,245,255,.58);text-transform:uppercase;letter-spacing:.08em}
.head-right{display:flex;align-items:center;gap:.7vw}
.points{text-align:right;min-width:3.6vw}.points strong{display:block;font-size:2vw;line-height:.9;font-weight:860;font-variant-numeric:tabular-nums}.points span{display:block;margin-top:.15vh;color:rgba(235,245,255,.65);font-size:.58vw;text-transform:uppercase;letter-spacing:.09em}
.screen{display:flex;align-items:center;gap:.3vw;padding:.42vh .6vw;border-radius:999px;border:1px solid rgba(57,235,169,.4);background:rgba(6,65,49,.17);color:#72f1b9;font-size:.72vw;font-weight:760}.screen.no{border-color:rgba(255,115,125,.42);background:rgba(88,18,29,.18);color:#ff9da7}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45vh .8vw;margin-top:.7vh;padding:.7vh 0;border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08)}
.stat{display:flex;align-items:center;justify-content:space-between;gap:.55vw;min-width:0}.stat-left{display:flex;align-items:center;gap:.42vw;min-width:0}.stat-icon{width:1.15vw;height:1.15vw;border-radius:50%;display:grid;place-items:center;background:rgba(91,190,255,.13);font-size:.62vw;flex:0 0 auto}.stat:nth-child(2) .stat-icon{background:rgba(50,235,171,.15)}.stat:nth-child(3) .stat-icon{background:rgba(255,202,75,.14)}.stat:nth-child(4) .stat-icon{background:rgba(255,181,75,.14)}
.stat-value{font-size:.98vw;line-height:1;font-weight:820}.stat-label{color:rgba(235,245,255,.70);font-size:.66vw;white-space:nowrap}
.tasks{padding-top:.65vh;display:grid;gap:.34vh}
.task{display:flex;align-items:center;gap:.45vw;font-size:.74vw;font-weight:620;color:#edf6ff;min-width:0}.task span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task.done span:last-child{text-decoration:line-through;text-decoration-thickness:1.5px;opacity:.62}
.check{width:.95vw;height:.95vw;border-radius:50%;display:grid;place-items:center;background:#29dfa0;color:#052218;font-size:.58vw;font-weight:900;flex:0 0 auto}.task.open .check{background:rgba(255,255,255,.06);border:1px solid rgba(190,220,245,.40);color:transparent}
.more{color:#9ed4ff;font-size:.65vw;font-weight:650;margin-left:1.4vw}.empty{color:#7ff0bc;font-size:.74vw;font-weight:650}
.yesterday{margin-top:.7vh;padding-top:.62vh;border-top:1px solid rgba(255,255,255,.08)}
.yesterday-title{font-size:.61vw;font-weight:790;letter-spacing:.09em;text-transform:uppercase;color:rgba(235,245,255,.56);margin-bottom:.35vh}
.history-list{display:grid;gap:.3vh}
.history-item{display:flex;align-items:center;gap:.42vw;font-size:.69vw;color:#dce9f6;min-width:0}
.history-item span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-icon{width:.9vw;height:.9vw;border-radius:50%;display:grid;place-items:center;font-size:.53vw;flex:0 0 auto}
.history-item.missed .history-icon{background:rgba(255,117,128,.16);color:#ff9ca5}
.history-item.reward .history-icon{background:rgba(255,202,75,.14);color:#ffd66c}
.history-empty{font-size:.67vw;color:rgba(235,245,255,.46)}
.sidebar-footer{margin-top:auto;display:flex;align-items:center;justify-content:flex-start}
.live{display:inline-flex;align-items:center;gap:.45vw;padding:.5vh .68vw;border-radius:999px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.04);color:#66f2b3;font-size:.74vw;font-weight:760}.live-dot{width:.58vw;height:.58vw;border-radius:50%;background:#4cf0ad;box-shadow:0 0 0 .26vw rgba(76,240,173,.10)}
.hero{position:relative;overflow:hidden;background:#07111e}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,17,29,.34) 0%,rgba(7,17,29,.08) 9%,rgba(7,17,29,0) 18%);z-index:2;pointer-events:none}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:0;transition:opacity .75s ease}.hero img.show{opacity:1}
.name,.points strong,.stat-value,.task,.date-main,.weather-detail,#weather-temp,.screen-text{text-shadow:0 1px 8px rgba(0,0,0,.45)}
@media(max-width:1200px){.app{grid-template-columns:44% 56%}.sidebar{padding:18px}.date-main{font-size:25px}.name{font-size:25px}.points strong{font-size:34px}.screen,.task,.stat-label,.weather-detail{font-size:12px}.stat-value{font-size:17px}.icon{font-size:20px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="date-wrap">
        <div class="date-label">Vandaag</div>
        <div id="date" class="date-main">—</div>
      </div>
      <div class="weather">
        <div class="weather-label">Weer</div>
        <div class="weather-main"><span id="weather-icon" class="icon">⛅</span><strong id="weather-temp">—°</strong></div>
        <div id="weather-text" class="weather-detail">Schoolweer laden…</div>
      </div>
    </div>

    <article class="child" data-child="michelle">
      <div class="child-head">
        <div><div class="name">Michelle</div><div class="child-sub">Vandaag</div></div>
        <div class="head-right"><div class="points"><strong>—</strong><span>points</span></div><div class="screen"><span>▣</span><span class="screen-text">Screen time: —</span></div></div>
      </div>
      <div class="stats">
        <div class="stat"><div class="stat-left"><div class="stat-icon">○</div><div class="stat-label">Outstanding</div></div><div class="stat-value outstanding-count">0</div></div>
        <div class="stat"><div class="stat-left"><div class="stat-icon">✓</div><div class="stat-label">Done</div></div><div class="stat-value completed-count">0</div></div>
        <div class="stat"><div class="stat-left"><div class="stat-icon">★</div><div class="stat-label">Rewards</div></div><div class="stat-value redemptions-count">0</div></div>
        <div class="stat"><div class="stat-left"><div class="stat-icon">!</div><div class="stat-label">Missed yesterday</div></div><div class="stat-value missed-count">0</div></div>
      </div>
      <div class="tasks"></div>
      <div class="yesterday"><div class="yesterday-title">Gisteren</div><div class="history-list"></div></div>
    </article>

    <article class="child" data-child="rassell">
      <div class="child-head">
        <div><div class="name">Rassell</div><div class="child-sub">Vandaag</div></div>
        <div class="head-right"><div class="points"><strong>—</strong><span>points</span></div><div class="screen"><span>▣</span><span class="screen-text">Screen time: —</span></div></div>
      </div>
      <div class="stats">
        <div class="stat"><div class="stat-left"><div class="stat-icon">○</div><div class="stat-label">Outstanding</div></div><div class="stat-value outstanding-count">0</div></div>
        <div class="stat"><div class="stat-left"><div class="stat-icon">✓</div><div class="stat-label">Done</div></div><div class="stat-value completed-count">0</div></div>
        <div class="stat"><div class="stat-left"><div class="stat-icon">★</div><div class="stat-label">Rewards</div></div><div class="stat-value redemptions-count">0</div></div>
        <div class="stat"><div class="stat-left"><div class="stat-icon">!</div><div class="stat-label">Missed yesterday</div></div><div class="stat-value missed-count">0</div></div>
      </div>
      <div class="tasks"></div>
      <div class="yesterday"><div class="yesterday-title">Gisteren</div><div class="history-list"></div></div>
    </article>

    <div class="sidebar-footer"><div class="live"><span class="live-dot"></span><span>Live</span></div></div>
  </aside>

  <main class="hero">
    <img id="image-a" alt="Family adventure visual">
    <img id="image-b" alt="" aria-hidden="true">
  </main>
</div>
<script>
const weatherUrl='https://api.open-meteo.com/v1/forecast?latitude=51.27833&longitude=3.83611&hourly=temperature_2m,apparent_temperature,precipitation_probability,weather_code,wind_speed_10m&forecast_days=1&timezone=Europe%2FAmsterdam';
let active=document.getElementById('image-a'),standby=document.getElementById('image-b'),imageKey='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const title=t=>esc(typeof t==='string'?t:t?.title||'');
function taskRows(data){
  const open=(data.outstandingTasks||[]).map(t=>({...t,_state:'open'}));
  const done=(data.completedTasks||[]).map(t=>({...t,_state:'done'}));
  const source=[...open,...done];
  if(!source.length)return '<div class="empty">Alles klaar ✓</div>';
  const visible=source.slice(0,4).map(t=>`<div class="task ${t._state}"><span class="check">${t._state==='done'?'✓':''}</span><span>${title(t)}</span></div>`).join('');
  return visible+(source.length>4?`<div class="more">+${source.length-4} more</div>`:'');
}
function yesterdayRows(data){
  const missed=(data.yesterdayIncompleteTasks||[]).map(t=>({type:'missed',title:t.title}));
  const rewards=(data.yesterdayRedemptions||[]).map(t=>({type:'reward',title:t.title}));
  const items=[...missed,...rewards];
  if(!items.length)return '<div class="history-empty">Niets gemist of ingewisseld</div>';
  const visible=items.slice(0,4).map(x=>`<div class="history-item ${x.type}"><span class="history-icon">${x.type==='missed'?'!':'★'}</span><span>${x.type==='missed'?'Gemist: ':'Beloning: '}${title(x.title)}</span></div>`).join('');
  return visible+(items.length>4?`<div class="more">+${items.length-4} more</div>`:'');
}
function renderChild(key,data){
  const root=document.querySelector(`[data-child="${key}"]`); if(!root||!data)return;
  root.querySelector('.points strong').textContent=data.points??0;
  const screen=root.querySelector('.screen'),no=data.screenTime==='No';
  screen.classList.toggle('no',no);root.querySelector('.screen-text').textContent=`Screen time: ${no?'No':'Yes'}`;
  root.querySelector('.outstanding-count').textContent=(data.outstandingTasks||[]).length;
  root.querySelector('.completed-count').textContent=(data.completedTasks||[]).length;
  root.querySelector('.redemptions-count').textContent=(data.redemptions||[]).length;
  const missed=Number(data.missedPoints??0);root.querySelector('.missed-count').textContent=missed<0?Math.abs(missed/2):(data.yesterdayIncompleteTasks||[]).length;
  root.querySelector('.tasks').innerHTML=taskRows(data);
  root.querySelector('.history-list').innerHTML=yesterdayRows(data);
}
function renderImageState(d){
  const url=d?.image_url||'';
  const key=String(d?.image_public_id||d?.image_version||url);
  if(!url||key===imageKey)return;
  standby.onload=()=>{standby.classList.add('show');active.classList.remove('show');[active,standby]=[standby,active];imageKey=key};
  standby.src=url+(url.includes('?')?'&':'?')+'t='+Date.now();
}
async function refreshData(){
  try{
    const r=await fetch(`latest.json?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(r.status);
    const d=await r.json();
    renderChild('rassell',d.children.rassell);
    renderChild('michelle',d.children.michelle);
    renderImageState(d);
    document.getElementById('date').textContent=new Intl.DateTimeFormat('nl-NL',{weekday:'long',day:'numeric',month:'long'}).format(new Date(`${d.date}T12:00:00`));
  }catch(e){console.error('Live data unavailable',e)}
}
const weatherInfo=c=>c===0?['☀️','Helder']:[1,2].includes(c)?['🌤️','Licht bewolkt']:c===3?['☁️','Bewolkt']:[45,48].includes(c)?['🌫️','Mist']:[51,53,55,56,57].includes(c)?['🌦️','Motregen']:[61,63,65,66,67,80,81,82].includes(c)?['🌧️','Regen']:[71,73,75,77,85,86].includes(c)?['🌨️','Sneeuw']:[95,96,99].includes(c)?['⛈️','Onweer']:['🌥️','Wisselend'];
function morningWeather(d){
  const h=d?.hourly;if(!h?.time?.length)return null;const rows=h.time.map((t,i)=>({t:new Date(t),temp:+h.temperature_2m[i],feel:+h.apparent_temperature[i],rain:+h.precipitation_probability[i],code:+h.weather_code[i],wind:+h.wind_speed_10m[i]}));const s=rows.filter(x=>x.t.getHours()>=7&&x.t.getHours()<=10);const a=s.length?s:rows.slice(0,4),avg=k=>a.reduce((z,x)=>z+x[k],0)/a.length;return{temp:avg('temp'),feel:Math.min(...a.map(x=>x.feel)),rain:Math.max(...a.map(x=>x.rain)),wind:Math.max(...a.map(x=>x.wind)),code:a.sort((x,y)=>y.code-x.code)[0]?.code||0};
}
function advice(w){const p=[];if(w.feel<5)p.push('warme jas');else if(w.feel<11)p.push('jas + trui');else if(w.feel<16)p.push('lichte jas');else if(w.feel<20)p.push('trui of vest');else p.push('T-shirt');if(w.rain>=55)p.push('regenjas mee');else if(w.rain>=30)p.push('kans op regen');if(w.wind>=35)p.push('winderig');return p.join(' · ')}
async function refreshWeather(){try{const r=await fetch(`${weatherUrl}&t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(r.status);const w=morningWeather(await r.json());if(!w)return;const [i,l]=weatherInfo(w.code);document.getElementById('weather-icon').textContent=i;document.getElementById('weather-temp').textContent=`${Math.round(w.temp)}°`;document.getElementById('weather-text').textContent=`${l} · ${advice(w)}`}catch(e){document.getElementById('weather-text').textContent='Schoolweer niet beschikbaar'}}
refreshData();refreshWeather();
setInterval(refreshData,15000);setInterval(refreshWeather,600000);
</script>
</body>
</html>
