<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>Family Dashboard</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#06101d;color:#f7fbff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:#06101d}
main{position:relative;width:100vw;height:100vh;overflow:hidden;background:#07111e}
.hero{position:absolute;inset:0;overflow:hidden;background:#07111e}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,10,19,.58) 0%,rgba(3,10,19,.04) 18%,rgba(3,10,19,.02) 54%,rgba(3,10,19,.18) 76%,rgba(3,10,19,.34) 100%);pointer-events:none}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:0;transition:opacity .8s ease}
.hero img.show{opacity:1}
.topbar{position:absolute;left:2.2vw;right:2.2vw;top:2.2vh;height:8.2vh;display:grid;grid-template-columns:1.15fr .9fr 1.35fr auto;align-items:center;gap:1vw;padding:0 1.35vw;border:1px solid rgba(255,255,255,.13);border-radius:1.3vw;background:rgba(7,18,33,.78);backdrop-filter:blur(16px);box-shadow:0 12px 34px rgba(0,0,0,.28);z-index:5}
.top-item{min-width:0;display:flex;align-items:center;gap:.75vw;font-size:1.16vw;font-weight:650;white-space:nowrap}
.icon{font-size:1.55vw;line-height:1}
.date-main{font-size:1.2vw;font-weight:760;letter-spacing:-.01em}
.pill{padding:.72vh .8vw;border-radius:999px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.05)}
.bridge{color:#cfe8ff}.bridge.open{color:#ff9aa4;border-color:rgba(255,100,115,.4);background:rgba(80,15,25,.44)}.bridge.soon{color:#ffd583;border-color:rgba(245,192,107,.4);background:rgba(76,55,12,.4)}
.weather{color:#eaf5ff}.weather strong{font-size:1.5vw;margin-right:.15vw}.weather-detail{color:#b9cee4;font-weight:560;overflow:hidden;text-overflow:ellipsis}
.live{justify-self:end;color:#66f2b3;font-weight:760}.live-dot{width:.78vw;height:.78vw;border-radius:50%;background:#4cf0ad;box-shadow:0 0 0 .38vw rgba(76,240,173,.12)}
.cards{position:absolute;left:1.8vw;right:1.8vw;bottom:2.1vh;display:grid;grid-template-columns:44% 44%;justify-content:space-between;align-items:end;gap:0;z-index:5;pointer-events:none}
.child{min-height:22.5vh;max-width:100%;padding:1vw 1.2vw .95vw;border-radius:1.25vw;border:1px solid rgba(180,220,255,.20);background:linear-gradient(180deg,rgba(8,28,49,.22),rgba(6,20,36,.28));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 26px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.05)}
.child-head{display:flex;align-items:center;justify-content:space-between;gap:.8vw;padding-bottom:.6vh;border-bottom:1px solid rgba(180,220,255,.16)}
.name{font-size:1.95vw;font-weight:800;letter-spacing:-.03em}
.head-right{display:flex;align-items:center;gap:1vw}
.points{text-align:center;min-width:4.6vw}.points strong{display:block;font-size:2.2vw;line-height:.86;font-weight:820;font-variant-numeric:tabular-nums}.points span{display:block;margin-top:.2vh;color:#c2d6ea;font-size:.62vw;text-transform:uppercase;letter-spacing:.1em}
.screen{display:flex;align-items:center;gap:.35vw;padding:.5vh .65vw;border-radius:999px;border:1px solid rgba(57,235,169,.52);background:rgba(6,65,49,.26);color:#6cf3b8;font-size:.84vw;font-weight:760}.screen.no{border-color:rgba(255,115,125,.52);background:rgba(88,18,29,.22);color:#ff9aa4}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.35vw;padding:.75vh 0 .7vh}
.stat{display:flex;align-items:center;gap:.45vw;min-width:0}.stat-icon{width:1.35vw;height:1.35vw;border-radius:50%;display:grid;place-items:center;background:rgba(91,190,255,.13);font-size:.72vw}.stat:nth-child(2) .stat-icon{background:rgba(50,235,171,.15)}.stat:nth-child(3) .stat-icon{background:rgba(255,202,75,.14)}.stat:nth-child(4) .stat-icon{background:rgba(255,181,75,.14)}
.stat-value{font-size:1.2vw;line-height:1;font-weight:800}.stat-label{margin-top:.12vh;color:#bfd1e2;font-size:.62vw;white-space:nowrap}
.tasks{border-top:1px solid rgba(180,220,255,.14);padding-top:.55vh;display:grid;gap:.3vh}
.task{display:flex;align-items:center;gap:.45vw;font-size:.78vw;font-weight:620;color:#edf6ff;min-width:0}.task span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.check{width:1.05vw;height:1.05vw;border-radius:50%;display:grid;place-items:center;background:#29dfa0;color:#052218;font-size:.66vw;font-weight:900;flex:0 0 auto}
.task.open .check{background:rgba(255,255,255,.08);border:1px solid rgba(190,220,245,.42);color:transparent}
.more{color:#8fc7ff;font-size:.72vw;font-weight:650;margin-left:1.5vw}
.empty{color:#71efb2;font-size:.78vw;font-weight:650}
.child:first-child{justify-self:start}.child:last-child{justify-self:end}
@media(max-width:1200px){.topbar{grid-template-columns:1fr 1fr}.weather{display:none}.cards{grid-template-columns:1fr;max-height:72vh;overflow:auto}.child{min-height:unset}.name{font-size:32px}.points strong{font-size:40px}.top-item{font-size:16px}.icon{font-size:22px}.task{font-size:14px}.stat-value{font-size:22px}.stat-label{font-size:11px}}
</style>
</head>
<body>
<main>
  <section class="hero"><img id="image-a" alt="Family adventure visual"><img id="image-b" alt="" aria-hidden="true"></section>

  <header class="topbar">
    <div class="top-item"><span class="icon">📅</span><span id="date" class="date-main">—</span></div>
    <div id="bridge" class="top-item pill bridge"><span class="icon">🌉</span><span class="bridge-text">Sluiskilbrug —</span></div>
    <div class="top-item pill weather"><span id="weather-icon" class="icon">⛅</span><strong id="weather-temp">—°</strong><span id="weather-text" class="weather-detail">Schoolweer laden…</span></div>
    <div class="top-item live"><span class="live-dot"></span><span>Live</span></div>
  </header>

  <section class="cards">
    <article class="child" data-child="michelle">
      <div class="child-head"><div class="name">Michelle</div><div class="head-right"><div class="points"><strong>—</strong><span>points</span></div><div class="screen"><span>▣</span><span class="screen-text">Screen time: —</span></div></div></div>
      <div class="stats">
        <div class="stat"><div class="stat-icon">✓</div><div><div class="stat-value outstanding-count">0</div><div class="stat-label">Outstanding</div></div></div>
        <div class="stat"><div class="stat-icon">✓</div><div><div class="stat-value completed-count">0</div><div class="stat-label">Done</div></div></div>
        <div class="stat"><div class="stat-icon">★</div><div><div class="stat-value redemptions-count">0</div><div class="stat-label">Rewards</div></div></div>
        <div class="stat"><div class="stat-icon">!</div><div><div class="stat-value missed-count">0</div><div class="stat-label">Missed yesterday</div></div></div>
      </div>
      <div class="tasks"></div>
    </article>

    <article class="child" data-child="rassell">
      <div class="child-head"><div class="name">Rassell</div><div class="head-right"><div class="points"><strong>—</strong><span>points</span></div><div class="screen"><span>▣</span><span class="screen-text">Screen time: —</span></div></div></div>
      <div class="stats">
        <div class="stat"><div class="stat-icon">✓</div><div><div class="stat-value outstanding-count">0</div><div class="stat-label">Outstanding</div></div></div>
        <div class="stat"><div class="stat-icon">✓</div><div><div class="stat-value completed-count">0</div><div class="stat-label">Done</div></div></div>
        <div class="stat"><div class="stat-icon">★</div><div><div class="stat-value redemptions-count">0</div><div class="stat-label">Rewards</div></div></div>
        <div class="stat"><div class="stat-icon">!</div><div><div class="stat-value missed-count">0</div><div class="stat-label">Missed yesterday</div></div></div>
      </div>
      <div class="tasks"></div>
    </article>
  </section>
</main>
<script>
const cloud='a3xk0plk',tag='family-dashboard-live',listUrl=`https://res.cloudinary.com/${cloud}/image/list/${tag}.json`;
const bridgeUrl='https://www.isdebrugopen.nl/zeeland/terneuzen/brug-sluiskil.json';
const weatherUrl='https://api.open-meteo.com/v1/forecast?latitude=51.27833&longitude=3.83611&hourly=temperature_2m,apparent_temperature,precipitation_probability,weather_code,wind_speed_10m&forecast_days=1&timezone=Europe%2FAmsterdam';
let active=document.getElementById('image-a'),standby=document.getElementById('image-b'),imageKey='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const title=t=>esc(typeof t==='string'?t:t?.title||'');
function taskRows(data){
  const open=data.outstandingTasks||[],done=data.completedTasks||[];
  const source=open.length?open:done, cls=open.length?'open':'done';
  if(!source.length)return '<div class="empty">Alles klaar ✓</div>';
  const visible=source.slice(0,2).map(t=>`<div class="task ${cls}"><span class="check">${open.length?'':'✓'}</span><span>${title(t)}</span></div>`).join('');
  return visible+(source.length>2?`<div class="more">+${source.length-2} more</div>`:'');
}
function renderChild(key,data){
  const root=document.querySelector(`[data-child="${key}"]`); if(!root||!data)return;
  root.querySelector('.points strong').textContent=data.points??0;
  const screen=root.querySelector('.screen'),no=data.screenTime==='No';
  screen.classList.toggle('no',no);root.querySelector('.screen-text').textContent=`Screen time: ${no?'No':'Yes'}`;
  root.querySelector('.outstanding-count').textContent=(data.outstandingTasks||[]).length;
  root.querySelector('.completed-count').textContent=(data.completedTasks||[]).length;
  root.querySelector('.redemptions-count').textContent=(data.redemptions||[]).length;
  const missed=Number(data.missedPoints??0);root.querySelector('.missed-count').textContent=missed<0?Math.abs(missed/2):(data.yesterdayIncompleteTasks||[]).length;
  root.querySelector('.tasks').innerHTML=taskRows(data);
}
async function refreshData(){
  try{
    const r=await fetch(`latest.json?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(r.status);
    const d=await r.json();renderChild('rassell',d.children.rassell);renderChild('michelle',d.children.michelle);
    document.getElementById('date').textContent=new Intl.DateTimeFormat('nl-NL',{weekday:'long',day:'numeric',month:'long'}).format(new Date(`${d.date}T12:00:00`));
  }catch(e){console.error('Live data unavailable',e)}
}
async function refreshImage(){
  try{
    const r=await fetch(`${listUrl}?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(r.status);
    const d=await r.json(),a=[...(d.resources||[])].sort((x,y)=>y.version-x.version)[0];if(!a)return;
    const key=`${a.public_id}:${a.version}`;if(key===imageKey)return;
    const id=a.public_id.split('/').map(encodeURIComponent).join('/');
    standby.onload=()=>{standby.classList.add('show');active.classList.remove('show');[active,standby]=[standby,active];imageKey=key};
    standby.src=`https://res.cloudinary.com/${cloud}/image/upload/f_auto,q_auto,c_fill,g_auto,ar_16:9/v${a.version}/${id}.${a.format}?t=${Date.now()}`;
  }catch(e){console.error('Image unavailable',e)}
}
const boolish=v=>v===true||v===1||['true','open','opened','geopend','ja'].includes(String(v).toLowerCase());
const first=(o,ks)=>{for(const k of ks)if(o?.[k]!==undefined&&o[k]!==null)return o[k]};
function bridgeState(d){
  const x=d?.bridge||d?.data||d||{},raw=first(x,['open','is_open','isOpen','opened','bridge_open','bridgeOpen']),status=String(first(x,['status','state','bridge_status','bridgeStatus'])??'').toLowerCase();
  const isOpen=raw!==undefined?boolish(raw):/(^|\b)(open|opened|geopend)(\b|$)/.test(status)&&!/closed|dicht|not open/.test(status);
  let eta=Number(first(x,['minutes_to_open','minutesToOpen','eta_minutes','etaMinutes','expected_in_minutes','expectedInMinutes']));
  return {isOpen,eta:Number.isFinite(eta)?eta:null};
}
function renderBridge(s){
  const el=document.getElementById('bridge'),t=el.querySelector('.bridge-text');el.classList.remove('open','soon');
  if(!s){t.textContent='Sluiskilbrug —';return} if(s.isOpen){el.classList.add('open');t.textContent='Sluiskilbrug OPEN';return}
  if(s.eta!==null&&s.eta<=20){el.classList.add('soon');t.textContent=`Brug ±${Math.round(s.eta)} min`;return} t.textContent='Sluiskilbrug dicht';
}
async function refreshBridge(){try{const r=await fetch(`${bridgeUrl}?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(r.status);renderBridge(bridgeState(await r.json()))}catch(e){renderBridge(null)}}
const weatherInfo=c=>c===0?['☀️','Helder']:[1,2].includes(c)?['🌤️','Licht bewolkt']:c===3?['☁️','Bewolkt']:[45,48].includes(c)?['🌫️','Mist']:[51,53,55,56,57].includes(c)?['🌦️','Motregen']:[61,63,65,66,67,80,81,82].includes(c)?['🌧️','Regen']:[71,73,75,77,85,86].includes(c)?['🌨️','Sneeuw']:[95,96,99].includes(c)?['⛈️','Onweer']:['🌥️','Wisselend'];
function morningWeather(d){
  const h=d?.hourly;if(!h?.time?.length)return null;const rows=h.time.map((t,i)=>({t:new Date(t),temp:+h.temperature_2m[i],feel:+h.apparent_temperature[i],rain:+h.precipitation_probability[i],code:+h.weather_code[i],wind:+h.wind_speed_10m[i]}));const s=rows.filter(x=>x.t.getHours()>=7&&x.t.getHours()<=10);const a=s.length?s:rows.slice(0,4),avg=k=>a.reduce((z,x)=>z+x[k],0)/a.length;return{temp:avg('temp'),feel:Math.min(...a.map(x=>x.feel)),rain:Math.max(...a.map(x=>x.rain)),wind:Math.max(...a.map(x=>x.wind)),code:a.sort((x,y)=>y.code-x.code)[0]?.code||0};
}
function advice(w){const p=[];if(w.feel<5)p.push('warme jas');else if(w.feel<11)p.push('jas + trui');else if(w.feel<16)p.push('lichte jas');else if(w.feel<20)p.push('trui of vest');else p.push('T-shirt');if(w.rain>=55)p.push('regenjas mee');else if(w.rain>=30)p.push('kans op regen');if(w.wind>=35)p.push('winderig');return p.join(' · ')}
async function refreshWeather(){try{const r=await fetch(`${weatherUrl}&t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(r.status);const w=morningWeather(await r.json());if(!w)return;const [i,l]=weatherInfo(w.code);document.getElementById('weather-icon').textContent=i;document.getElementById('weather-temp').textContent=`${Math.round(w.temp)}°`;document.getElementById('weather-text').textContent=`${l} · ${advice(w)}`}catch(e){document.getElementById('weather-text').textContent='Schoolweer niet beschikbaar'}}
refreshImage();refreshData();refreshBridge();refreshWeather();
setInterval(refreshImage,30000);setInterval(refreshData,15000);setInterval(refreshBridge,60000);setInterval(refreshWeather,600000);
</script>
</body>
</html>
