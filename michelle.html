<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>Michelle — Family Dashboard</title>
<link rel="stylesheet" href="child-app.css?v=3">
</head>
<body>
<main>
<header class="top">
<div><p class="eyebrow">Today</p><h1>Michelle</h1></div>
<div class="points"><strong id="points">—</strong><span>points</span></div>
</header>
<div class="screen-banner" id="screen"><span class="dot"></span><div><span class="screen-label">Screen time today</span><strong class="screen-value">—</strong></div></div>
<section class="weekly-summary" aria-labelledby="weekly-title">
<div class="weekly-heading"><div><p class="eyebrow">Jouw week</p><h2 id="weekly-title">Weekoverzicht voor Michelle</h2></div><span>Elke zondag vernieuwd</span></div>
<div class="weekly-poster"><img id="weekly-image" alt="Wekelijks overzicht met feedback voor Michelle"><div id="weekly-placeholder">Je eerste weekoverzicht wordt gemaakt…</div></div>
</section>
<section class="rewards">
<h2>Redeem points</h2>
<div class="reward-grid">
<button class="reward" type="button" data-reward="dessert" data-cost="6"><strong>🍨 Dessert</strong><span>6 points</span></button>
<button class="reward" type="button" data-reward="screen" data-cost="12"><strong>30 min extra screen time</strong><span>12 points</span></button>
<button class="reward cash" type="button" data-reward="cash" data-cost="42"><strong>€5 cash</strong><span>42 points</span></button>
</div>
</section>
<section class="ideas" aria-labelledby="ideas-title">
<details class="ideas-fold"><summary><h2 id="ideas-title">💡 Voorstellen <span id="ideas-count" class="ideas-count"></span></h2></summary>
<p class="ideas-intro">Heb je een idee voor een taakje of een beloning? Stel het voor, papa of mama kiest.</p>
<form class="idea-form" data-kind="task"><label>Taakje voorstellen<input name="idea" maxlength="60" placeholder="Bv. de tafel dekken" autocomplete="off" required></label><button type="submit">Voorstellen</button></form>
<form class="idea-form" data-kind="reward"><label>Beloning voorstellen<input name="idea" maxlength="60" placeholder="Bv. naar McDonald's" autocomplete="off" required></label><label class="idea-cost">Punten<input name="cost" type="number" min="1" max="500" inputmode="numeric" placeholder="?"></label><button type="submit">Voorstellen</button></form>
<div id="my-ideas" class="my-ideas"></div>
<p class="message" id="idea-message" aria-live="polite"></p>
</details>
</section>
<h2>Outstanding tasks</h2>
<section class="tasks" id="tasks"></section>
<p class="message" id="message" aria-live="polite"></p>
</main>
<script>const CHILD='Michelle';</script>
<script src="child-app.js?v=2"></script>
<script src="proposals.js?v=2"></script>
<script src="boss-tasks.js?v=1"></script>
</body>
</html>
