<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>Rassell — Family Dashboard</title>
<link rel="stylesheet" href="child-app.css">
</head>
<body>
<main>
<header class="top">
<div><p class="eyebrow">Today</p><h1>Rassell</h1></div>
<div class="points"><strong id="points">—</strong><span>points</span></div>
</header>
<div class="screen-banner" id="screen"><span class="dot"></span><div><span class="screen-label">Screen time today</span><strong class="screen-value">—</strong></div></div>
<section class="weekly-summary" aria-labelledby="weekly-title">
<div class="weekly-heading"><div><p class="eyebrow">Jouw week</p><h2 id="weekly-title">Weekoverzicht voor Rassell</h2></div><span>Elke zondag vernieuwd</span></div>
<div class="weekly-poster"><img id="weekly-image" alt="Wekelijks overzicht met feedback voor Rassell"><div id="weekly-placeholder">Je eerste weekoverzicht wordt gemaakt…</div></div>
</section>
<section class="rewards">
<h2>Redeem points</h2>
<div class="reward-grid">
<button class="reward" type="button" data-reward="screen" data-cost="12"><strong>30 min extra screen time</strong><span>12 points</span></button>
<button class="reward cash" type="button" data-reward="cash" data-cost="42"><strong>€5 cash</strong><span>42 points</span></button>
</div>
</section>
<h2>Outstanding tasks</h2>
<section class="tasks" id="tasks"></section>
<p class="message" id="message" aria-live="polite"></p>
</main>
<script>const CHILD='Rassell';</script>
<script src="child-app.js"></script>
</body>
</html>
